# Власні метрики вузла (UserParameter). Ключ,команда
# Навантаження на одне ядро: load average (1 хв) / кількість CPU
UserParameter=lab.load.per_cpu,awk -v n="$(nproc)" '{printf "%.2f", $1/n}' /proc/loadavg
# Кількість процесів у стані R (виконуються або чекають CPU)
UserParameter=lab.proc.running,awk '/procs_running/ {print $2}' /proc/stat
